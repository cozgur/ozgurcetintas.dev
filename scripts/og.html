<!doctype html>
<!-- Source of site/assets/og.png: open in a 1200x630 viewport once the fonts load and screenshot it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #2563eb; --ok: #16a34a; }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; background: #fff; color: var(--ink); font-family: 'Inter', sans-serif; }
      .frame { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; border-top: 10px solid var(--accent); }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; }
      .mono { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 21px; font-weight: 700; }
      .status { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 21px; font-weight: 500; color: #334155; }
      .status i { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); }
      .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; }
      h1 { font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; }
      p { margin-top: 24px; max-width: 900px; font-size: 29px; line-height: 1.45; color: var(--muted); font-weight: 500; }
      .url { font-size: 22px; font-weight: 600; color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="top">
        <div class="brand"><span class="mono">ÖÇ</span>Özgür Çetintaş</div>
        <div class="status"><i></i>Open to new roles</div>
      </div>
      <div class="middle">
        <h1>Quality Engineer &amp; Builder</h1>
        <p>Senior QA engineer who builds things.</p>
      </div>
      <div class="url">ozgurcetintas.dev</div>
    </div>
  </body>
</html>
