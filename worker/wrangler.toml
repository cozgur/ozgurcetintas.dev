# Telegram relay for visits, CV downloads and link clicks on ozgurcetintas.dev.
# Secrets, set once with `npx wrangler secret put <NAME>`: TELEGRAM_TOKEN, TELEGRAM_CHAT_ID.
name = "site-notify"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# At most 20 notifications a minute across all visitors.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Daily unique-visitor counts. Holds one-way hashes for two days at most, never IPs.
[[kv_namespaces]]
binding = "VISITORS"
id = "5581ecf0885a48058405baf555f26a5b"
